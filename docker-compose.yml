version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecdat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecdat
      POSTGRES_USER: ecdat_user
      POSTGRES_PASSWORD: ecdat_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdat_user -d ecdat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ecdat-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ecdat_user:ecdat_secure_password@db:5432/ecdat
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ecdat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
